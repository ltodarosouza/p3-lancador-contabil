<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da Denise — Prado Contabilidade</title>
<link rel="stylesheet" href="/estilo.css">
</head>
<body>
<header class="topo-site">
  <div class="miolo">
    <a class="marca-site" href="/"><span class="selo" aria-hidden="true">P</span><span>Prado Contabilidade<small>Lançador de mensagens</small></span></a>
    <nav class="menu" aria-label="Telas">
      <a href="/">Lançador</a>
      <a href="/fila">Fila</a>
      <a href="/painel" aria-current="page">Painel</a>
    </nav>
  </div>
</header>

<main>
  <div class="cabecalho">
    <span class="sobre">Só para a Denise</span>
    <h1>Painel do mês</h1>
    <p>Quanto o mês teria custado, no preço pago do modelo, e quem passou do teto de mensagens do plano.</p>
  </div>

  <form id="entrada" class="cartao" autocomplete="off">
    <div class="entrada-chave">
      <label class="campo">Sua chave <input id="chave" type="password" required></label>
      <label class="campo">Mês <input id="mes" type="month"></label>
      <button class="botao">Ver o mês</button>
    </div>
  </form>

  <p id="aviso" class="faixa" hidden></p>

  <div id="indicadores" class="indicadores" hidden>
    <div class="indicador"><span>Mensagens no mês</span><strong id="total-msgs"></strong></div>
    <div class="indicador"><span>Custo do mês (R$)</span><strong id="total-custo"></strong></div>
    <div class="indicador" id="ind-teto"><span>Passaram do teto</span><strong id="total-passaram"></strong></div>
  </div>

  <div class="tabela" id="tabela" hidden>
    <table>
      <thead><tr><th>Cliente</th><th>Plano</th><th class="n">Uso do teto</th><th class="n">Barradas</th><th class="n">Custo (R$)</th><th></th></tr></thead>
      <tbody id="linhas"></tbody>
    </table>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const el = (tag, texto, cls) => { const e = document.createElement(tag); e.textContent = texto; if (cls) e.className = cls; return e; };
  const reais = (v) => Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 4, maximumFractionDigits: 4 });
  let chave = ""; // só nesta página, na memória; não fica guardada em lugar nenhum

  const faixa = (texto, cls) => { $("aviso").textContent = texto; $("aviso").className = "faixa " + cls; $("aviso").hidden = false; };

  async function ver() {
    const mes = $("mes").value;
    let r, c;
    try {
      r = await fetch("/api/painel" + (mes ? "?mes=" + encodeURIComponent(mes) : ""), { headers: { authorization: "Bearer " + chave } });
      c = await r.json();
    } catch { r = { ok: false }; c = { erro: "sem_conexao" }; }
    if (!r.ok) {
      $("tabela").hidden = true; $("indicadores").hidden = true;
      faixa({ nao_autenticado: "A chave não vale.", so_a_denise: "Este painel é só da Denise.", fila_sem_chaves: "O servidor ainda não tem as chaves.", mes_invalido: "Mês inválido.", sem_conexao: "Sem conexão com o servidor." }[c.erro] || "Não deu para ler o painel (" + c.erro + ").", "erro");
      return;
    }
    $("mes").value = c.mes;
    if (c.passaram_do_teto.length) faixa("Passaram do teto em " + c.mes + ": " + c.passaram_do_teto.join(", ") + ". Estão no plano errado.", "aviso");
    else faixa("Ninguém passou do teto em " + c.mes + ".", "ok");
    $("linhas").replaceChildren(...c.clientes.map((l) => {
      const tr = el("tr", undefined, l.passou_do_teto ? "passou-linha" : "");
      const uso = el("td", undefined, "n"), pct = Math.min(100, l.teto ? (l.mensagens / l.teto) * 100 : 0);
      const barra = el("span", "", "barra-uso" + (pct >= 100 || l.passou_do_teto ? " cheia" : "")), preench = el("i", ""); preench.style.width = pct + "%"; barra.append(preench);
      uso.append(el("span", l.mensagens + " de " + l.teto), barra);
      tr.append(el("td", l.cliente_id + " · " + l.empresa), el("td", l.plano), uso, el("td", l.barradas, "n"), el("td", reais(l.custo_brl), "n"));
      const fim = el("td", ""); if (l.passou_do_teto) fim.append(el("span", "passou do teto", "marca aviso")); tr.append(fim);
      return tr;
    }));
    $("total-msgs").textContent = c.mensagens_total;
    $("total-custo").textContent = reais(c.custo_total_brl);
    $("total-passaram").textContent = c.passaram_do_teto.length;
    $("ind-teto").className = "indicador" + (c.passaram_do_teto.length ? " alerta" : "");
    $("indicadores").hidden = false;
    $("tabela").hidden = false;
  }
  $("entrada").onsubmit = (e) => { e.preventDefault(); chave = $("chave").value; ver(); };
</script>
</body>
</html>

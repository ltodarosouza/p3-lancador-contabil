<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fila de conferência — Prado Contabilidade</title>
<link rel="stylesheet" href="/estilo.css">
</head>
<body>
<header class="topo-site">
  <div class="miolo">
    <a class="marca-site" href="/"><span class="selo" aria-hidden="true">P</span><span>Prado Contabilidade<small>Lançador de mensagens</small></span></a>
    <nav class="menu" aria-label="Telas">
      <a href="/">Lançador</a>
      <a href="/fila" aria-current="page">Fila</a>
      <a href="/painel">Painel</a>
    </nav>
  </div>
</header>

<main>
  <div class="cabecalho">
    <span class="sobre">Tiago, Aline e Denise</span>
    <h1>Fila de conferência</h1>
    <p>Lançamentos para aprovar ou corrigir, perguntas prontas e o que o sistema não conseguiu ler, cada um com a mensagem original ao lado. Nada vira lançamento sem a sua conferência.</p>
  </div>
  <form id="entrada" class="cartao" autocomplete="off">
    <div class="entrada-chave">
      <label class="campo">Sua chave <input id="chave" type="password" required></label>
      <button class="botao">Entrar</button>
    </div>
    <p id="quem" class="nota"></p>
  </form>
  <div class="ferramentas">
    <div class="resumo" id="resumo"></div>
    <button type="button" id="baixar" class="botao sec">Baixar o que foi aprovado (arquivo de importação)</button>
    <p id="baixou" class="nota"></p>
  </div>
  <div class="lista" id="lista"></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const NOME = { lancamento: "Lançamento", sem_lancamento: "Sem lançamento", pendencia: "Pergunta ao cliente", nao_entendido: "Não entendido" };
  const ESTADO = { aguardando: "aguardando", aprovado: "aprovado", corrigido: "corrigido", devolvido: "mandado de volta", dispensado: "dispensado" };
  const MOTIVO = { validacao: "o que o modelo devolveu não passou na conferência", resposta_cortada: "a resposta veio cortada", limite_do_provedor: "o provedor pediu para esperar e não liberou", bloqueada_pelo_provedor: "o provedor bloqueou a resposta", resposta_ilegivel: "a resposta não veio no formato", pedido_recusado: "o provedor recusou o pedido", erro_no_modelo: "erro ao falar com o modelo", teto_do_plano: "o cliente passou do limite de mensagens do plano" };
  const el = (tag, texto, cls) => { const e = document.createElement(tag); if (texto !== undefined) e.textContent = texto; if (cls) e.className = cls; return e; };
  const reais = (v) => Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

  // A chave é de cada pessoa (Tiago, Aline, Denise) e fica só nesta aba. Quem a pessoa é e o que ela vê o servidor decide.
  const guardada = { ler() { try { return sessionStorage.getItem("chave") || ""; } catch { return ""; } }, gravar(v) { try { sessionStorage.setItem("chave", v); } catch { /* sem armazenamento: pede de novo */ } } };
  const cabecalhos = (extra = {}) => ({ ...extra, authorization: "Bearer " + guardada.ler() });

  const falhas = new Map(); // id -> o que deu errado; o item que não salvou volta ao topo, com aviso, até salvar
  let salvoAgora = null;    // id do último item gravado, para a tela dizer "salvo"
  const estado = (item, texto, cls) => { let e = item.querySelector(".estado") || item.appendChild(el("p", "", "estado")); e.className = "estado " + (cls || ""); e.textContent = texto; };

  async function agir(corpo, itemEl, botoes) {
    botoes.forEach((b) => (b.disabled = true)); // o clique duplo não aprova duas vezes
    estado(itemEl, "Salvando…", "salvando");
    let r, c;
    try {
      r = await fetch("/api/fila", { method: "POST", headers: cabecalhos({ "content-type": "application/json" }), body: JSON.stringify(corpo) });
      c = await r.json();
    } catch { r = { ok: false }; c = { erro: "sem_conexao" }; }
    if (!r.ok) {
      const motivo = c.erro === "correcao_invalida" ? "a correção não passou na conferência (" + c.detalhes.map((d) => d.campo).join(", ") + ")" : c.erro === "sem_conexao" ? "sem conexão com o servidor" : c.erro === "nao_autenticado" ? "a chave não vale; entre de novo" : "o servidor devolveu erro (" + c.erro + ")";
      falhas.set(corpo.id, "Não salvou: " + motivo + ". O item continua aguardando; confira e tente de novo.");
      return carregar();
    }
    falhas.delete(corpo.id);
    salvoAgora = corpo.id;
    carregar();
  }

  function desenhar(i) {
    const item = el("article", undefined, "item t-" + i.tipo + (i.aviso ? " com-aviso" : "") + (i.estado !== "aguardando" ? " encerrado" : ""));
    const topo = el("div", undefined, "topo");
    topo.append(el("h2", NOME[i.tipo]), el("span", i.cliente_id + (i.mensagem_id ? " · " + i.mensagem_id : ""), "marca"), el("span", ESTADO[i.estado], "marca" + (i.estado === "aprovado" || i.estado === "corrigido" ? " ok" : i.estado === "aguardando" ? " info" : "")));
    if (i.aviso || falhas.has(i.id)) topo.append(el("span", "ler com atenção", "marca aviso"));
    if (i.lancamento?.data_assumida) topo.append(el("span", "data assumida", "marca aviso"));
    item.append(topo);
    const orig = el("blockquote"); orig.append(el("span", "Mensagem original"), el("div", i.mensagem)); item.append(orig);
    const dir = el("div", undefined, "lado");
    if (i.tipo === "lancamento") {
      const l = i.lancamento, dl = el("dl", undefined, "dados");
      [["Data", l.data + (l.data_assumida ? " (assumida: a mensagem não diz a data)" : "")], ["Tipo", l.tipo], ["Categoria", l.categoria], ["Valor", reais(l.valor)], ["Forma", l.forma], ["Com quem", l.contraparte || "—"], ["Descrição", l.descricao || "—"]].forEach(([k, v]) => dl.append(el("dt", k), el("dd", v)));
      dir.append(dl);
    } else if (i.tipo === "pendencia") dir.append(el("p", "Pergunta pronta para mandar ao cliente:"), el("div", i.pergunta));
    else if (i.tipo === "sem_lancamento") dir.append(el("p", "O modelo não viu lançamento nesta mensagem. Só para dar uma olhada:"), el("div", i.motivo_do_modelo || "—"));
    else {
      dir.append(el("p", "Motivo:"), el("div", MOTIVO[i.motivo] || i.motivo));
      if (i.tentativas) dir.append(el("p", "Tentativas ao provedor: " + i.tentativas));
      if (i.o_que_fazer) dir.append(el("p", "O que fazer:"), el("div", i.o_que_fazer));
    }
    item.append(dir);
    if (i.tipo === "lancamento" && i.estado === "aguardando") {
      const acoes = el("div", undefined, "acoes");
      const campos = {};
      [["data", "Data (AAAA-MM-DD)"], ["valor", "Valor"], ["categoria", "Categoria"], ["forma", "Forma"]].forEach(([k, rotulo]) => {
        const lab = el("label", undefined, "campo"); lab.append(el("span", rotulo));
        const inp = el("input"); inp.placeholder = String(i.lancamento[k]); campos[k] = inp; lab.append(inp); acoes.append(lab);
      });
      const motivoLab = el("label", undefined, "campo largo"), motivo = el("input"); motivo.placeholder = "Só se for mandar de volta"; motivoLab.append(el("span", "Motivo"), motivo);
      const aprovar = el("button", "Aprovar", "botao"), corrigir = el("button", "Corrigir e salvar", "botao sec"), devolver = el("button", "Mandar de volta", "botao perigo");
      aprovar.onclick = () => agir({ id: i.id, acao: "aprovar" }, item, [aprovar, corrigir, devolver]);
      devolver.onclick = () => {
        if (!motivo.value.trim()) { falhas.set(i.id, "Não salvou: diga o motivo para mandar de volta."); return carregar(); }
        agir({ id: i.id, acao: "devolver", motivo: motivo.value.trim() }, item, [aprovar, corrigir, devolver]);
      };
      corrigir.onclick = () => {
        const mudou = {}; for (const [k, inp] of Object.entries(campos)) if (inp.value.trim()) mudou[k] = k === "valor" ? Number(inp.value.replace(",", ".")) : inp.value.trim();
        agir({ id: i.id, acao: "corrigir", campos: mudou }, item, [aprovar, corrigir, devolver]);
      };
      acoes.append(motivoLab, aprovar, corrigir, devolver); item.append(acoes);
    }
    if (i.tipo === "sem_lancamento" && i.estado === "aguardando") {
      const acoes = el("div", undefined, "acoes"), dispensar = el("button", "Já vi, dispensar", "botao sec");
      dispensar.onclick = () => agir({ id: i.id, acao: "dispensar" }, item, [dispensar]);
      acoes.append(dispensar); item.append(acoes);
    }
    if (i.devolucao) item.append(el("p", "Mandado de volta por " + i.devolucao.por + ": " + i.devolucao.motivo, "historico"));
    if (i.correcao) item.append(el("p", "Corrigido por " + i.correcao.por + ": " + Object.entries(i.correcao.campos).map(([k, v]) => k + " " + v.de + " → " + v.para).join("; "), "historico"));
    if (falhas.has(i.id)) estado(item, falhas.get(i.id), "falhou");
    else if (salvoAgora === i.id) estado(item, "Salvo.", "salvo");
    return item;
  }

  async function carregar() {
    const r = await fetch("/api/fila", { headers: cabecalhos() });
    const c = await r.json();
    if (!r.ok) {
      $("quem").textContent = c.erro === "fila_sem_chaves" ? "A fila está fechada: o servidor ainda não tem as chaves." : guardada.ler() ? "A chave não vale." : "Digite a sua chave para ver a fila.";
      $("resumo").replaceChildren(); $("lista").replaceChildren();
      return;
    }
    $("quem").textContent = "Você entrou como " + c.voce + ".";
    $("resumo").replaceChildren(...Object.entries(c.resumo).flatMap(([tipo, estados]) => Object.entries(estados).map(([e, n]) => el("span", NOME[tipo] + " · " + e + ": " + n, "marca" + (e === "aguardando" ? " info" : "")))));
    $("lista").replaceChildren(...(c.itens.length ? [...c.itens].sort((x, y) => falhas.has(y.id) - falhas.has(x.id)).map(desenhar) : [el("p", "A fila está vazia. Quando uma mensagem for lida no Lançador, ela aparece aqui.", "vazio")]));
  }
  // POST entrega só o que ainda não saiu e marca como entregue; o arquivo seguinte não repete linha.
  $("baixar").onclick = async () => {
    $("baixou").textContent = "Gerando…";
    try {
      const r = await fetch("/api/exportar", { method: "POST", headers: cabecalhos() });
      if (!r.ok) { $("baixou").textContent = "Não gerou o arquivo (" + (await r.json()).erro + ")."; return; }
      const texto = await r.text();
      const a = el("a"); a.href = URL.createObjectURL(new Blob([texto], { type: "text/csv" })); a.download = /filename="([^"]+)"/.exec(r.headers.get("content-disposition") || "")?.[1] || "lancamentos.csv";
      a.click(); URL.revokeObjectURL(a.href);
      $("baixou").textContent = "Arquivo baixado com " + (texto.trim().split("\n").length - 1) + " lançamento(s) novo(s).";
    } catch { $("baixou").textContent = "Sem conexão com o servidor."; }
  };
  $("entrada").onsubmit = (e) => { e.preventDefault(); guardada.gravar($("chave").value); $("chave").value = ""; carregar(); };
  carregar();
</script>
</body>
</html>
